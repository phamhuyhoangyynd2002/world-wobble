<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>T4 – Wob trong pho 3D</title>
    <script src="_shared/vendor/gsap.min.js"></script>
    <style>
      html, body { width: 1920px; height: 1080px; margin: 0; background: #e6dfd3; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #stage { position: absolute; inset: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="t4" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="8" data-track-index="0"></div>
    </div>
    <script>
      // canh3d.js là module (chạy trễ): giữ chỗ promise trước, module gọi __t4Resolve({ tl }) khi dựng xong
      window.T4 = { ready: new Promise(function (r) { window.__t4Resolve = r; }) };
      window.T4.ready.then(function (x) {
        window.__timelines = window.__timelines || {};
        window.__timelines["t4"] = x.tl;
      });
    </script>
    <script type="module" src="canh3d.js"></script>
  </body>
</html>
