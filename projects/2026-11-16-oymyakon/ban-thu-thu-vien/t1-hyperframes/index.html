<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<script src="_shared/vendor/gsap.min.js"></script>
<style>html,body{width:1920px;height:1080px;margin:0}#root{position:relative;width:100%;height:100%;overflow:hidden}
.bg{position:absolute;inset:0;background:#EFE3C8}.floor{position:absolute;left:0;right:0;top:820px;height:6px;background:#1E2A2B}
#wob{position:absolute;left:360px;top:420px;width:400px;height:400px}#wob img{width:400px;height:400px}</style></head>
<body><div id="root" data-composition-id="t1" data-start="0" data-duration="5" data-width="1920" data-height="1080">
<div class="clip bg" data-start="0" data-duration="5" data-track-index="0"></div>
<div class="floor"></div>
<div id="wob"><div id="wob-sq"><img src="wob.svg" alt="" /></div></div></div>
<script>
const tl = gsap.timeline({ paused: true });
gsap.set("#wob-sq", { transformOrigin: "50% 100%" });
[20, 65, 110].forEach((f, i) => {
  const t = f / 30;
  tl.to("#wob-sq", { scaleX: 1.18, scaleY: 0.78, duration: 0.2, ease: "power2.out" }, t)              // lấy đà
    .to("#wob-sq", { scaleX: 0.9, scaleY: 1.18, duration: 0.07, ease: "power2.in" }, t + 0.2)          // bật
    .to("#wob", { x: "+=300", duration: 0.53, ease: "none" }, t + 0.27)
    .to("#wob", { y: -260, duration: 0.265, ease: "power2.out" }, t + 0.27)                             // lên
    .to("#wob", { y: 0, duration: 0.265, ease: "power2.in" }, t + 0.535)                                // xuống
    .to("#wob-sq", { scaleX: 1, scaleY: 1, duration: 0.2, ease: "sine.inOut" }, t + 0.32)
    .fromTo("#wob-sq", { scaleX: 1.3, scaleY: 0.65 }, { scaleX: 1, scaleY: 1, duration: 0.6, ease: "elastic.out(1.1, 0.35)", immediateRender: false }, t + 0.8); // chạm đất
});
tl.set({}, {}, 5);
window.__timelines = { t1: tl };
</script></body></html>
